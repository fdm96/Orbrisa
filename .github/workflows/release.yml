name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          xcodebuild -project Orbrisa.xcodeproj -scheme Orbrisa -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -quiet build
          test -d build/Build/Products/Release-appletvos/Orbrisa.app

      - name: Package IPA
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [[ "$VERSION" == v* ]] || VERSION="v$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/Build/Products/Release-appletvos/Orbrisa.app/Info.plist)"
          mkdir -p Payload
          cp -R build/Build/Products/Release-appletvos/Orbrisa.app Payload/
          IPA="Orbrisa-${VERSION}-unsigned.ipa"
          zip -qry "$IPA" Payload
          shasum -a 256 "$IPA" > "$IPA.sha256"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.ipa }}
          path: |
            ${{ steps.package.outputs.ipa }}
            ${{ steps.package.outputs.ipa }}.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Orbrisa ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.ipa }}
            ${{ steps.package.outputs.ipa }}.sha256
